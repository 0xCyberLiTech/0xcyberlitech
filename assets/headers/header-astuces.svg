  <line x1="18" y1="36" x2="30" y2="22" stroke="#00d9ff" stroke-width="1.2" stroke-opacity="0.7"/>
  
    <g stroke="#00d9ff" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="56" width="52" height="14" rx="2"/>
      <rect x="52" y="75" width="52" height="14" rx="2"/>
