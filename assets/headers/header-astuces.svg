  <text x="600" y="118" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">COMMANDES SYSTÈME AVANCÉES  ·  DIAGNOSTIC RÉSEAU  ·  AUTOMATISATION BASH</text>
