      <line x1="70" y1="101" x2="96" y2="101" stroke-opacity="0.6"/>
    </g>

  <!-- Right Symmetric Telemetry Pod (Width 120px: x=1062..1182) -->
  <rect x="1062" y="22" width="120" height="116" rx="4" fill="#060b16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
  <g stroke="#00d9ff" fill="none" stroke-width="1.2" stroke-opacity="0.8">
    <circle cx="1122" cy="58" r="18" stroke-dasharray="4,2"/>
